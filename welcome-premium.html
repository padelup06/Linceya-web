<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-itunes-app" content="app-id=6760952174">
<script src="/app-banner.js" defer></script>
<title>Bienvenue dans Linceya Premium</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="Linceya" />
<link rel="manifest" href="/site.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@300;400;500;600;700;800&family=Archivo+Black&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Linceya v6 "NOIR & OR" — welcome premium (re-skin prudent) */
:root {
  --cream: #0B0B0D;
  --pearl: #FFFFFF;
  --carbon: #15151A;
  --carbon-high: #1C1D24;
  --ink: #F2F3F7;
  --navy: #1A2B4D;
  --platinum: #B48A4A;
  --platinum-light: #D4B87A;
  --gold: #C9A75A;
  --gold-light: #F6E5AE;
  --gold-deep: #8E6825;
  --on-gold: #1E1503;
  --signal: #1E47F0;
  --muted: #8B93A5;
  --stroke: #26272E;
  --stroke-strong: #33353E;
  --font-display: 'Anton', 'Archivo Black', 'Archivo', sans-serif;
  --font-anton: 'Anton', sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}
@keyframes liquid { 0%, 100% { background-position: 0% 0; } 50% { background-position: 100% 0; } }
@keyframes sweep { 0% { left: -70%; } 55% { left: 145%; } 100% { left: 145%; } }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background:
    radial-gradient(ellipse 70% 50% at 50% 0%, rgba(201,167,90,0.1), transparent 60%),
    var(--cream);
  color: var(--ink);
  font-family: var(--font-body);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 32px 20px; -webkit-font-smoothing: antialiased;
}
.card {
  width: 100%; max-width: 480px;
  background: linear-gradient(170deg, var(--carbon-high), var(--carbon));
  border-radius: 28px; border: 1px solid var(--stroke-strong);
  padding: 48px 36px 40px; text-align: center;
  box-shadow: 0 24px 60px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.05);
}
.success-icon {
  width: 64px; height: 64px; border-radius: 50%;
  background: linear-gradient(160deg, #F6E5AE, #C9A75A 55%, #8E6825);
  color: var(--on-gold); font-size: 32px; line-height: 64px;
  margin: 0 auto 24px; box-shadow: 0 12px 28px rgba(201,167,90,0.35), inset 0 1px 0 rgba(255,255,255,0.7);
}
.eyebrow {
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--gold); margin-bottom: 14px;
}
h1 {
  font-family: var(--font-anton); font-weight: 400;
  font-size: 32px; line-height: 1.08; letter-spacing: 0.03em;
  text-transform: uppercase; color: var(--pearl); margin-bottom: 14px;
}
h1 .accent {
  background: linear-gradient(115deg, #F7E9B8 0%, #E3C57A 20%, #96742E 42%, #F4E3AC 58%, #C9A75A 78%, #96742E 100%);
  background-size: 230% 100%;
  -webkit-background-clip: text; background-clip: text;
  color: transparent; -webkit-text-fill-color: transparent;
  animation: liquid 6s ease-in-out infinite;
}
p { font-size: 15px; line-height: 1.6; color: var(--muted); margin-bottom: 12px; }
.status { font-family: var(--font-mono); font-size: 12px; color: var(--platinum-light); margin: 18px 0 22px; letter-spacing: 0.04em; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; padding: 16px 22px; border-radius: 14px;
  font-family: var(--font-body); font-size: 14px; font-weight: 700;
  letter-spacing: 0.04em; text-transform: uppercase;
  text-decoration: none; transition: transform 0.15s, box-shadow 0.2s, filter 0.2s, border-color 0.2s;
}
.btn-primary {
  position: relative; overflow: hidden;
  background: linear-gradient(180deg, #F8E9B6 0%, #DDBC6E 30%, #B58A3C 70%, #8E6825 100%);
  color: var(--on-gold);
  box-shadow: 0 12px 34px rgba(201,167,90,0.35), inset 0 2px 0 rgba(255,255,255,0.85), inset 0 -3px 6px rgba(90,60,10,0.5);
}
.btn-primary::after {
  content: ''; position: absolute; top: 0; left: -70%; width: 36%; height: 100%;
  background: linear-gradient(115deg, transparent, rgba(255,255,255,0.7), transparent);
  transform: skewX(-22deg); animation: sweep 3.6s ease-in-out infinite;
}
.btn-primary:hover { transform: translateY(-2px); filter: brightness(1.05); }
.btn-store {
  background: rgba(255,255,255,0.05); color: var(--ink);
  border: 1px solid var(--stroke-strong);
  text-transform: none; letter-spacing: 0; font-weight: 600;
}
.btn-store:hover { border-color: var(--platinum); background: rgba(180,138,74,0.1); }
.btn-row { display: flex; gap: 10px; margin-top: 12px; }
.btn-row .btn { flex: 1; padding: 14px; font-size: 13px; }
.fallback { display: none; margin-top: 28px; padding-top: 28px; border-top: 1px solid var(--stroke); }
.fallback.show { display: block; }
.fallback h2 { font-family: var(--font-body); font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.06em; }
.fallback p { font-size: 13px; }
.spinner {
  display: inline-block; width: 14px; height: 14px;
  border: 2px solid rgba(201,167,90,0.25); border-top-color: var(--gold);
  border-radius: 50%; animation: spin 0.8s linear infinite;
  vertical-align: middle; margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.foot { margin-top: 32px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.foot a { color: var(--platinum-light); text-decoration: none; }
@media (prefers-reduced-motion: reduce) {
  .btn-primary::after { animation: none; }
}
</style>
</head>
<body>
<div class="card">
  <div class="success-icon">✓</div>
  <div class="eyebrow" id="eyebrow">// BIENVENUE</div>
  <h1 id="title">LINCEYA<br><span class="accent">PREMIUM</span></h1>
  <p id="subtitle">Ton abonnement est actif. On t'ouvre l'app dans un instant…</p>

  <div class="status" id="status"><span class="spinner"></span><span id="status-text">Ouverture de l'app…</span></div>

  <a href="#" class="btn btn-primary" id="open-app-btn" style="display:none;">
    <span id="open-app-label">Ouvrir Linceya</span> <span>→</span>
  </a>

  <div class="fallback" id="fallback">
    <h2 id="fallback-title">L'app n'est pas installée ?</h2>
    <p id="fallback-desc">Télécharge Linceya pour finaliser ton compte Premium et commencer à analyser tes matchs.</p>
    <div class="btn-row">
      <a href="https://apps.apple.com/app/linceya-coach-ia-padel/id6760952174" class="btn btn-store" target="_blank" rel="noopener noreferrer">App Store</a>
      <a href="https://play.google.com/store/apps/details?id=com.padelup.padelup" class="btn btn-store" target="_blank" rel="noopener noreferrer">Google Play</a>
    </div>
  </div>

  <div class="foot">© 2026 LINCEYA · <a href="/contact.html">Support</a></div>
</div>

<script>
(function() {
  var lang = (navigator.language || 'fr').slice(0,2).toLowerCase();
  var I18N = {
    fr: {
      eyebrow: '// BIENVENUE',
      title: 'LINCEYA<br><span class="accent">PREMIUM</span>',
      subtitle: "Ton abonnement est actif. On t'ouvre l'app dans un instant…",
      statusOpening: 'Ouverture de l\'app…',
      statusReady: 'Si l\'app ne s\'est pas ouverte, clique ci-dessous',
      openBtn: 'Ouvrir Linceya',
      fallbackTitle: "L'app n'est pas installée ?",
      fallbackDesc: 'Télécharge Linceya pour finaliser ton compte Premium et commencer à analyser tes matchs.',
    },
    en: {
      eyebrow: '// WELCOME',
      title: 'LINCEYA<br><span class="accent">PREMIUM</span>',
      subtitle: 'Your subscription is active. Opening the app shortly…',
      statusOpening: 'Opening the app…',
      statusReady: "If the app didn't open, tap below",
      openBtn: 'Open Linceya',
      fallbackTitle: 'App not installed?',
      fallbackDesc: 'Download Linceya to finalize your Premium account and start analyzing your matches.',
    },
    es: {
      eyebrow: '// BIENVENIDO',
      title: 'LINCEYA<br><span class="accent">PREMIUM</span>',
      subtitle: 'Tu suscripción está activa. Abriendo la app en un momento…',
      statusOpening: 'Abriendo la app…',
      statusReady: 'Si la app no se ha abierto, toca abajo',
      openBtn: 'Abrir Linceya',
      fallbackTitle: '¿La app no está instalada?',
      fallbackDesc: 'Descarga Linceya para finalizar tu cuenta Premium y empezar a analizar tus partidos.',
    },
  };
  var t = I18N[lang] || I18N.fr;
  document.documentElement.lang = lang;
  document.getElementById('eyebrow').textContent = t.eyebrow;
  document.getElementById('title').innerHTML = t.title;
  document.getElementById('subtitle').textContent = t.subtitle;
  document.getElementById('status-text').textContent = t.statusOpening;
  document.getElementById('open-app-label').textContent = t.openBtn;
  document.getElementById('fallback-title').textContent = t.fallbackTitle;
  document.getElementById('fallback-desc').textContent = t.fallbackDesc;

  // Supabase peut renvoyer le token soit en query (?code=xxx, flow PKCE)
  // soit en fragment (#access_token=xxx, flow implicit).
  //
  // Le SDK Supabase Flutter en mode PKCE détecte AUTOMATIQUEMENT :
  // - access_token dans le fragment → setSession (implicit)
  // - code dans la query → exchangeCodeForSession (PKCE)
  // Mais il NE reconnaît PAS access_token en query.
  //
  // Donc on forward search ET fragment tels quels, sans conversion.
  // Les custom URL schemes (padelup://) préservent le fragment sur iOS
  // (contrairement aux Universal Links où il peut être strippé).
  var search = window.location.search || '';
  var fragment = window.location.hash || '';
  var deepLink = 'padelup://login-callback/' + search + fragment;

  var visibilityChanged = false;
  document.addEventListener('visibilitychange', function() {
    if (document.hidden) visibilityChanged = true;
  });

  // Tente immédiatement le deep link. Si l'app est installée, iOS prompt
  // "Ouvrir Linceya ?" et l'user accepte → app ouverte. Sinon le fallback
  // ci-dessous (1.5s) affiche les boutons App Store / Play Store.
  try { window.location.href = deepLink; } catch (e) {}

  setTimeout(function() {
    if (visibilityChanged) return;
    document.getElementById('status-text').textContent = t.statusReady;
    document.querySelector('.spinner').style.display = 'none';
    var btn = document.getElementById('open-app-btn');
    btn.href = deepLink;
    btn.style.display = 'inline-flex';
    document.getElementById('fallback').classList.add('show');
  }, 1500);
})();
</script>
</body>
</html>
